name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Read-only by default; only the release job can write, and only after a build on main or a tag.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-15

    steps:
      # Third-party actions are pinned to commit SHAs so a moved tag can't change what runs.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          mkdir -p release
          cd dist
          ditto -c -k --keepParent AudioPriorityBar.app ../release/AudioPriorityBar.zip
          cd ../release
          shasum -a 256 AudioPriorityBar.zip > AudioPriorityBar.zip.sha256
          cat AudioPriorityBar.zip.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AudioPriorityBar
          path: release/
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: AudioPriorityBar
          path: release

      - name: Create Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from the latest commit on main. Ad-hoc signed, not notarized.

            **Commit:** ${{ github.sha }}
            **Date:** ${{ github.event.head_commit.timestamp }}
          files: |
            release/AudioPriorityBar.zip
            release/AudioPriorityBar.zip.sha256
          prerelease: true

      - name: Create Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release/AudioPriorityBar.zip
            release/AudioPriorityBar.zip.sha256
          generate_release_notes: true
